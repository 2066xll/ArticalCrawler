<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ filename }} - 文章阅读</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* 全局样式 */
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        
        /* 容器样式 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 卡片样式 */
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background-color: white;
            overflow: hidden;
        }
        
        /* 卡片头部样式 */
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
        }
        
        /* 标题样式 */
        .card-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }
        
        /* 文章内容样式 */
        .article-content {
            padding: 2rem;
            line-height: 1.8;
            font-size: 1.1rem;
            color: #444;
        }
        
        /* 段落样式 */
        .article-content p {
            margin-bottom: 1.5rem;
            text-align: justify;
        }
        
        /* 导航按钮样式 */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }
        
        /* 按钮样式 */
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        
        .nav-btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }
        
        .nav-btn-secondary:hover {
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.4);
        }
        
        /* 返回按钮样式 */
        .back-btn {
            margin-bottom: 20px;
        }
        
        /* 文章信息样式 */
        .article-info {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e9ecef;
        }
        
        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            font-size: 1.2rem;
            color: #6c757d;
        }
        
        /* 页脚样式 */
        .footer {
            margin-top: 2rem;
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-buttons {
                flex-direction: column;
                gap: 1rem;
            }
            
            .nav-btn {
                width: 100%;
                justify-content: center;
            }
            
            .article-content {
                padding: 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 返回按钮 -->
        <a href="/" class="btn btn-outline-secondary back-btn" style="margin-top: 20px;">
            <i class="bi bi-arrow-left me-2"></i>返回首页
        </a>
        
        <!-- 文章卡片 -->
        <div class="card shadow-lg">
            <div class="card-header">
                <h1 class="text-center">{{ filename }}</h1>
            </div>
            
            <div class="article-content">
                {% if content %}
                    <div class="article-info">
                        <p>文件类型: {{ file_type }}</p>
                    </div>
                    
                    <!-- 文章内容 -->
                    <div style="white-space: pre-wrap;">{{ content }}</div>
                {% else %}
                    <div class="loading">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                        <p class="mt-3">正在加载文章内容...</p>
                    </div>
                {% endif %}
            </div>
            
            <!-- 导航按钮 -->
            <div class="nav-buttons">
                {% if prev_article %}
                    <a href="/article/{{ prev_article }}" class="nav-btn">
                        <i class="bi bi-arrow-left"></i>
                        上一章
                    </a>
                {% else %}
                    <button class="nav-btn" disabled>
                        <i class="bi bi-arrow-left"></i>
                        上一章
                    </button>
                {% endif %}
                
                <a href="/" class="nav-btn nav-btn-secondary">
                    <i class="bi bi-house"></i>
                    首页
                </a>
                
                {% if next_article %}
                    <a href="/article/{{ next_article }}" class="nav-btn">
                        下一章
                        <i class="bi bi-arrow-right"></i>
                    </a>
                {% else %}
                    <button class="nav-btn" disabled>
                        下一章
                        <i class="bi bi-arrow-right"></i>
                    </button>
                {% endif %}
            </div>
        </div>
        
        <!-- 页脚 -->
        <div class="footer">
            <p>&copy; 2025 文章爬取工具. All rights reserved.</p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
