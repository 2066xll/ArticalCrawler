<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爬取历史记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* 全局样式 */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* 容器样式 */
        .container {
            margin-top: 50px;
            max-width: 1000px;
        }
        
        /* 卡片样式 */
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }
        
        .card:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }
        
        /* 卡片头部样式 */
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 1.5rem;
        }
        
        /* 标题样式 */
        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }
        
        /* 卡片内容样式 */
        .card-body {
            padding: 1.5rem;
        }
        
        /* 按钮样式 */
        .btn {
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background-color: #6c757d;
            border: none;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 117, 125, 0.4);
            background-color: #5a6268;
        }
        
        /* 状态徽章样式 */
        .status-badge {
            margin-right: 10px;
            font-weight: 600;
        }
        
        /* 文件列表样式 */
        .file-list {
            margin-top: 1rem;
        }
        
        .file-item {
            margin-bottom: 0.5rem;
        }
        
        /* 历史记录卡片样式 */
        .history-card {
            border-left: 4px solid #667eea;
        }
        
        /* 加载样式 */
        #loading {
            text-align: center;
            padding: 5rem 0;
        }
        
        /* 空状态样式 */
        #empty-state {
            text-align: center;
            padding: 5rem 0;
            color: #6c757d;
        }
        
        #empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        #empty-state h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        #empty-state p {
            margin-bottom: 1.5rem;
        }
        
        /* 文件链接样式 */
        .file-item a {
            text-decoration: none;
            color: #667eea;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }
        
        .file-item a:hover {
            background-color: rgba(102, 126, 234, 0.1);
            color: #5a67d8;
        }
        
        /* 错误信息样式 */
        .text-danger {
            font-weight: 500;
        }
        
        /* 标题样式 */
        h5 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #495057;
        }
        
        /* 统计信息样式 */
        .text-muted {
            color: #6c757d;
        }
        
        /* 响应式设计 */
        @media (max-width: 576px) {
            .container {
                margin-top: 20px;
                padding: 0 15px;
            }
            
            .card-header {
                padding: 1rem;
            }
            
            .card-body {
                padding: 1rem;
            }
            
            .history-card .card-header {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 0.5rem;
            }
            
            .history-card .card-header div:last-child {
                font-size: 0.875rem;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        /* 列表组样式 */
        .list-group {
            gap: 1rem;
        }
        
        /* 文件网格样式 */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 0.5rem;
        }
        
        /* 任务ID样式 */
        .task-id {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h1><i class="bi bi-clock-history me-2"></i>爬取历史记录</h1>
                    <a href="/" class="btn btn-light">
                        <i class="bi bi-house-door-fill me-2"></i>返回首页
                    </a>
                </div>
            </div>
            <div class="card-body">
                <div id="loading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3">正在加载历史记录...</p>
                </div>
                
                <div id="history-list" style="display: none;">
                    <div class="mb-3">
                        <h5><i class="bi bi-list-ul me-2"></i>历史任务列表</h5>
                        <p class="text-muted">共 <span id="total-count">0</span> 个任务</p>
                    </div>
                    
                    <div class="list-group" id="tasks-container">
                        <!-- 历史任务将通过JavaScript动态加载 -->
                    </div>
                </div>
                
                <div id="empty-state" class="text-center py-5" style="display: none;">
                    <div class="mb-3">
                        <i class="bi bi-clock-history text-muted" style="font-size: 5rem;"></i>
                    </div>
                    <h3>暂无历史记录</h3>
                    <p class="text-muted">您还没有执行过爬取任务</p>
                    <a href="/" class="btn btn-primary mt-3">
                        <i class="bi bi-play-circle-fill me-2"></i>去爬取文章
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 页面加载时获取历史记录
        document.addEventListener('DOMContentLoaded', function() {
            fetchHistory();
        });
        
        function fetchHistory() {
            fetch('/api/history')
                .then(response => response.json())
                .then(history => {
                    const loadingElement = document.getElementById('loading');
                    const historyListElement = document.getElementById('history-list');
                    const emptyStateElement = document.getElementById('empty-state');
                    const totalCountElement = document.getElementById('total-count');
                    const tasksContainerElement = document.getElementById('tasks-container');
                    
                    loadingElement.style.display = 'none';
                    
                    if (history.length === 0) {
                        emptyStateElement.style.display = 'block';
                    } else {
                        historyListElement.style.display = 'block';
                        totalCountElement.textContent = history.length;
                        
                        // 按时间倒序排列
                        history.sort((a, b) => new Date(b.start_time) - new Date(a.start_time));
                        
                        // 渲染历史记录
                        let html = '';
                        history.forEach(task => {
                            // 状态徽章
                            let statusBadge = '';
                            let statusIcon = '';
                            switch (task.status) {
                                case 'completed':
                                    statusBadge = '<span class="badge bg-success status-badge"><i class="bi bi-check-circle-fill me-1"></i>已完成</span>';
                                    break;
                                case 'failed':
                                    statusBadge = '<span class="badge bg-danger status-badge"><i class="bi bi-x-circle-fill me-1"></i>失败</span>';
                                    break;
                                default:
                                    statusBadge = '<span class="badge bg-secondary status-badge"><i class="bi bi-question-circle-fill me-1"></i>未知</span>';
                            }
                            
                            // 格式徽章
                            const formatBadge = `<span class="badge bg-info"><i class="bi bi-filetype-${task.format} me-1"></i>${task.format.toUpperCase()}</span>`;
                            
                            // 文件列表
                            let fileListHtml = '';
                            if (task.output_files && task.output_files.length > 0) {
                                fileListHtml = `
                                    <div class="file-list mt-3">
                                        <h6 class="mb-2"><i class="bi bi-files me-2"></i>生成文件 (${task.file_count} 个):</h6>
                                        <div class="file-grid">
                                            ${task.output_files.map(file => `
                                                <div class="file-item">
                                                    <a href="/download/${task.output_dir}/${file}" class="text-decoration-none">
                                                        <i class="bi bi-download"></i> ${file}
                                                    </a>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `;
                            }
                            
                            html += `
                                <div class="card shadow history-card">
                                    <div class="card-header bg-light">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                ${statusBadge}
                                                ${formatBadge}
                                                <span class="text-muted task-id">任务ID: ${task.id.substring(0, 8)}...</span>
                                            </div>
                                            <div class="text-sm text-muted">
                                                ${task.start_time}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-2">
                                            <strong><i class="bi bi-link me-2"></i>URL:</strong> 
                                            <a href="${task.url}" target="_blank" class="text-primary text-decoration-none" title="点击查看原文">
                                                ${task.url}
                                            </a>
                                        </div>
                                        <div class="row g-2 mt-3">
                                            <div class="col-md-3 col-sm-6">
                                                <strong><i class="bi bi-book-open me-2"></i>爬取章节:</strong> ${task.next_chapters + 1} 章
                                            </div>
                                            <div class="col-md-5 col-sm-6">
                                                <strong><i class="bi bi-folder me-2"></i>输出目录:</strong> ${task.output_dir}
                                            </div>
                                            <div class="col-md-4 col-sm-12">
                                                <strong><i class="bi bi-file-earmark-text me-2"></i>文件数:</strong> ${task.file_count || 0} 个
                                            </div>
                                        </div>
                                        ${task.end_time ? `<div class="mt-2"><strong><i class="bi bi-clock-fill me-2"></i>结束时间:</strong> ${task.end_time}</div>` : ''}
                                        ${fileListHtml}
                                        ${task.error ? `<div class="mt-3 text-danger"><strong><i class="bi bi-exclamation-triangle-fill me-2"></i>错误信息:</strong> ${task.error}</div>` : ''}
                                    </div>
                                </div>
                            `;
                        });
                        
                        tasksContainerElement.innerHTML = html;
                        
                        // 添加动画效果
                        const cards = tasksContainerElement.querySelectorAll('.history-card');
                        cards.forEach((card, index) => {
                            card.classList.add('fade-in');
                            card.style.animationDelay = `${index * 0.1}s`;
                        });
                    }
                })
                .catch(error => {
                    console.error('获取历史记录失败:', error);
                    const loadingElement = document.getElementById('loading');
                    loadingElement.innerHTML = `
                        <div class="text-center py-5">
                            <div class="text-danger mb-3">
                                <i class="bi bi-exclamation-circle-fill" style="font-size: 3rem;"></i>
                            </div>
                            <h5 class="mb-2">加载失败</h5>
                            <p class="text-muted mb-3">无法加载历史记录，请稍后重试</p>
                            <button onclick="fetchHistory()" class="btn btn-primary">
                                <i class="bi bi-arrow-repeat me-2"></i>重新加载
                            </button>
                        </div>
                    `;
                });
        }
    </script>
</body>
</html>
