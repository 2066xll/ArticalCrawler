<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://api.example.com; font-src 'self' https://cdn.jsdelivr.net; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests; block-all-mixed-content;">
    <title>文章内容 - 文章爬取工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="article">
    <div class="container article-container">
        <div class="card shadow">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h1 class="text-center flex-grow-1"><i class="bi bi-file-text-fill me-2"></i>文章内容</h1>
                    <a href="/" class="btn btn-primary btn-sm">
                        <i class="bi bi-house-door-fill me-2"></i>返回首页
                    </a>
                </div>
            </div>
            <div class="card-body">
                <!-- 导航按钮 -->
                <div class="article-navigation">
                    <button id="prevArticle" class="btn btn-outline-primary" disabled data-url="">
                        <i class="bi bi-chevron-left me-2"></i>上一章
                    </button>
                    <h2 id="articleTitle" class="article-title"></h2>
                    <button id="nextArticle" class="btn btn-outline-primary" disabled data-url="">
                        下一章<i class="bi bi-chevron-right ms-2"></i>
                    </button>
                </div>
                
                <!-- 文章元信息 -->
                <div class="article-meta" id="articleMeta">
                    <span id="articleFilename" class="text-muted"></span>
                </div>
                
                <!-- 文章内容 -->
                <div id="articleContent" class="article-content">
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                        <p class="mt-2">正在加载文章内容...</p>
                    </div>
                </div>
                
                <!-- 页脚导航 -->
                <div class="article-navigation mt-4">
                    <button id="prevArticleFooter" class="btn btn-outline-primary" disabled data-url="">
                        <i class="bi bi-chevron-left me-2"></i>上一章
                    </button>
                    <button id="nextArticleFooter" class="btn btn-outline-primary" disabled data-url="">
                        下一章<i class="bi bi-chevron-right ms-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // 从URL中获取文件名
        function getFilenameFromUrl() {
            const pathname = window.location.pathname;
            // 移除开头的 '/article/'
            const filename = pathname.replace(/^\/article\//, '');
            return decodeURIComponent(filename);
        }
        
        // 加载文章内容
        function loadArticle() {
            const filename = getFilenameFromUrl();
            
            if (!filename) {
                document.getElementById('articleContent').innerHTML = '<div class="alert alert-danger" role="alert">无法获取文章文件名</div>';
                return;
            }
            
            // 设置标题和元信息
            document.getElementById('articleTitle').textContent = filename;
            document.getElementById('articleFilename').textContent = filename;
            
            // 发送请求获取文章内容
            fetch(`/api/article/${encodeURIComponent(filename)}`)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP错误! 状态码: ${response.status}`);
                    return response.text(); // 先获取文本，再尝试解析JSON
                })
                .then(text => {
                    if (!text) throw new Error('空响应');
                    try {
                        return JSON.parse(text); // 显式解析JSON，捕获解析错误
                    } catch (e) {
                        throw new Error(`JSON解析错误: ${e.message}`);
                    }
                })
                .then(data => {
                    if (data.success) {
                        // 显示文章内容
                        document.getElementById('articleContent').innerHTML = `<pre>${data.content}</pre>`;
                        
                        // 设置导航按钮
                        const prevBtn = document.getElementById('prevArticle');
                        const nextBtn = document.getElementById('nextArticle');
                        const prevBtnFooter = document.getElementById('prevArticleFooter');
                        const nextBtnFooter = document.getElementById('nextArticleFooter');
                        
                        if (data.prev_article) {
                            prevBtn.disabled = false;
                            prevBtn.setAttribute('data-url', data.prev_article);
                            prevBtnFooter.disabled = false;
                            prevBtnFooter.setAttribute('data-url', data.prev_article);
                        }
                        
                        if (data.next_article) {
                            nextBtn.disabled = false;
                            nextBtn.setAttribute('data-url', data.next_article);
                            nextBtnFooter.disabled = false;
                            nextBtnFooter.setAttribute('data-url', data.next_article);
                        }
                    } else {
                        document.getElementById('articleContent').innerHTML = `<div class="alert alert-danger" role="alert">加载失败: ${data.error}</div>`;
                    }
                })
                .catch(error => {
                    document.getElementById('articleContent').innerHTML = `<div class="alert alert-danger" role="alert">加载失败: ${error.message}</div>`;
                });
        }
        
        // 页面加载时自动加载文章
        document.addEventListener('DOMContentLoaded', loadArticle);
        
        // 为导航按钮添加事件监听器
        document.addEventListener('DOMContentLoaded', function() {
            const prevBtn = document.getElementById('prevArticle');
            const nextBtn = document.getElementById('nextArticle');
            const prevBtnFooter = document.getElementById('prevArticleFooter');
            const nextBtnFooter = document.getElementById('nextArticleFooter');
            
            function navigateTo(url) {
                window.location.href = `/article/${url}`;
            }
            
            if (prevBtn) {
                prevBtn.addEventListener('click', function() {
                    const prevUrl = this.getAttribute('data-url');
                    if (prevUrl) {
                        navigateTo(prevUrl);
                    }
                });
            }
            
            if (nextBtn) {
                nextBtn.addEventListener('click', function() {
                    const nextUrl = this.getAttribute('data-url');
                    if (nextUrl) {
                        navigateTo(nextUrl);
                    }
                });
            }
            
            if (prevBtnFooter) {
                prevBtnFooter.addEventListener('click', function() {
                    const prevUrl = this.getAttribute('data-url');
                    if (prevUrl) {
                        navigateTo(prevUrl);
                    }
                });
            }
            
            if (nextBtnFooter) {
                nextBtnFooter.addEventListener('click', function() {
                    const nextUrl = this.getAttribute('data-url');
                    if (nextUrl) {
                        navigateTo(nextUrl);
                    }
                });
            }
        });
    </script>
</body>
</html>
