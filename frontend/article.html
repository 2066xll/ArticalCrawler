<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章内容 - 文章抓取</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --main-accent: #ff4d4d;
            --border-color: #1a1a1a;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --shadow-offset: 6px;
        }

        body {
            background-color: var(--bg-color);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            padding: 2rem 1rem;
            margin: 0;
            line-height: 1.8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 导航条 */
        .brutal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 4px solid var(--border-color);
        }

        /* 按钮重置 */
        .btn {
            border: 3px solid var(--border-color);
            border-radius: 0;
            font-weight: 800;
            text-transform: uppercase;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 4px 4px 0 var(--border-color);
            transition: all 0.1s;
            background-color: #ffd700;
            color: var(--text-color);
            text-decoration: none;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--border-color);
            background-color: #ffcc00;
            color: var(--text-color);
            text-decoration: none;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--border-color);
        }

        .btn-outline-secondary {
            background-color: #fff;
        }

        .btn-outline-secondary:hover {
            background-color: #f8f8f8;
        }

        /* 页面标题 */
        .article-header {
            margin-bottom: 2rem;
            background: var(--card-bg);
            border: 4px solid var(--border-color);
            padding: 2rem;
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--border-color);
        }

        .article-title {
            font-weight: 900;
            font-size: 2.5rem;
            margin: 0 0 1rem 0;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-weight: bold;
            font-size: 0.9rem;
            color: #555;
            background: #e0e0e0;
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-color);
            display: inline-flex;
        }

        /* 文章内容 */
        .article-content {
            background: var(--card-bg);
            border: 4px solid var(--border-color);
            padding: 2rem;
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--border-color);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .article-content p {
            margin-bottom: 1.5em;
        }

        .article-content img {
            max-width: 100%;
            height: auto;
            border: 3px solid var(--border-color);
            display: block;
            margin: 2rem auto;
            box-shadow: 4px 4px 0 var(--border-color);
        }

        /* 章节导航 */
        .chapter-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 4px dashed var(--border-color);
            flex-wrap: wrap;
        }

        .chapter-btn {
            background-color: var(--main-accent);
            color: white;
            flex: 1;
            min-width: 200px;
            justify-content: center;
        }

        .chapter-btn:hover {
            background-color: #ff3333;
            color: white;
            text-decoration: none;
        }

        .chapter-btn.disabled {
            background-color: #ccc;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .nav-center {
            text-align: center;
            font-weight: bold;
            background: #1a1a1a;
            color: #00ff00;
            padding: 0.5rem 1rem;
            border: 3px solid var(--border-color);
            flex: 0 1 auto;
        }
        
        @media (max-width: 768px) {
            .chapter-nav { flex-direction: column; }
            .chapter-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="brutal-nav">
            <a href="/" class="btn">
                <iconify-icon icon="ph:house-bold"></iconify-icon> 溜回首页
            </a>
            <a href="/history" class="btn btn-outline-secondary">
                <iconify-icon icon="ph:clock-counter-clockwise-bold"></iconify-icon> 翻翻旧账
            </a>
        </div>
        
        <div class="article-header">
            <h1 class="article-title">文章内容</h1>
            <div class="article-meta">
                
                <span class="meta-item"><iconify-icon icon="ph:user-bold"></iconify-icon> 码字工: {{ metadata.author }}</span>
                {% endif %}
                {% if metadata.date %}
                <span class="meta-item"><iconify-icon icon="ph:calendar-blank-bold"></iconify-icon> 时间: {{ metadata.date }}</span>
                {% endif %}
                <span class="meta-item"><iconify-icon icon="ph:folder-bold"></iconify-icon> 藏书阁: {{ output_dir }}</span>
            </div>
        </div>
        
        <div class="article-content">
            {{ content | safe if content else '文章内容全碎了...' }}
        </div>
        
        <div class="chapter-nav">
            {% if prev_url %}
            <a href="/crawl_and_view?url={{ prev_url }}&format={{ format }}&output_dir={{ output_dir }}" class="btn chapter-btn">
                <iconify-icon icon="ph:arrow-fat-left-bold"></iconify-icon> 上一章，冲冲冲
            </a>
            {% else %}
            <button class="btn chapter-btn disabled" disabled>
                <iconify-icon icon="ph:x-circle-bold"></iconify-icon> 到头了，没拉
            </button>
            {% endif %}
            
            <div class="nav-center">
                <iconify-icon icon="ph:book-open-text-bold"></iconify-icon> 当前阅读
            </div>
            
            {% if next_url %}
            <a href="/crawl_and_view?url={{ next_url }}&format={{ format }}&output_dir={{ output_dir }}" class="btn chapter-btn">
                <iconify-icon icon="ph:arrow-fat-right-bold"></iconify-icon> 下一章，走起
            </a>
            {% else %}
            <button class="btn chapter-btn disabled" disabled>
                <iconify-icon icon="ph:x-circle-bold"></iconify-icon> 后面啥也没有
            </button>
            {% endif %}
        </div>
        
    </div>
</body>
</html>
