<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试按钮点击</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>测试按钮点击</h1>
        
        <!-- 简单测试按钮 -->
        <button class="btn btn-primary" id="testBtn">测试按钮</button>
        
        <!-- 模拟原始表单 -->
        <form id="crawl-form" class="mt-5">
            <div class="mb-3">
                <label for="url" class="form-label">URL</label>
                <input type="url" class="form-control" id="url" value="https://www.example.com">
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn">开始爬取</button>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 测试简单按钮
        document.getElementById('testBtn').addEventListener('click', function() {
            alert('测试按钮点击成功！');
            console.log('测试按钮被点击');
        });
        
        // 测试表单提交
        document.getElementById('crawl-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('表单提交成功！');
            console.log('表单提交事件触发');
        });
        
        // 测试直接点击提交按钮
        document.getElementById('submit-btn').addEventListener('click', function(e) {
            e.preventDefault();
            alert('提交按钮点击成功！');
            console.log('提交按钮被点击');
        });
        
        console.log('测试脚本加载成功');
        console.log('testBtn:', document.getElementById('testBtn'));
        console.log('crawl-form:', document.getElementById('crawl-form'));
        console.log('submit-btn:', document.getElementById('submit-btn'));
    </script>
</body>
</html>
