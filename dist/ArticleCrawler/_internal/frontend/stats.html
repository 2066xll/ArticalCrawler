<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' *; font-src 'self' https://cdn.jsdelivr.net; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests; block-all-mixed-content;">
    <title>统计分析 - 文章爬取工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 卡片样式优化 */
        .stat-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        
        /* 卡片头部样式 */
        .stat-card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 1.5rem;
        }
        
        /* 卡片内容样式 */
        .stat-card-body {
            padding: 2rem;
        }
        
        /* 统计数据样式 */
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 1rem;
        }
        
        /* 图表容器样式 */
        .chart-container {
            position: relative;
            height: 400px;
            margin-top: 1rem;
        }
        
        /* 趋势图样式 */
        .trend-chart {
            height: 350px;
        }
        
        /* 效率图样式 */
        .efficiency-chart {
            height: 350px;
        }
        
        /* 筛选控件样式 */
        .filter-controls {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .stat-value {
                font-size: 2rem;
            }
            
            .chart-container {
                height: 300px;
            }
            
            .stat-card-body {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题卡片 -->
        <div class="card shadow fade-in">
            <div class="card-header bg-gradient">
                <h1 class="text-center mb-0"><i class="bi bi-bar-chart-line me-3"></i>统计分析</h1>
            </div>
        </div>

        <!-- 筛选控件卡片 -->
        <div class="card shadow mt-4 fade-in" style="animation-delay: 0.1s;">
            <div class="card-body">
                <div class="filter-controls">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">时间范围</label>
                            <select class="form-select" id="timeRange">
                                <option value="7">最近7天</option>
                                <option value="30">最近30天</option>
                                <option value="90">最近90天</option>
                                <option value="all">全部</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">状态</label>
                            <select class="form-select" id="statusFilter">
                                <option value="all">所有状态</option>
                                <option value="completed">已完成</option>
                                <option value="failed">失败</option>
                                <option value="running">运行中</option>
                                <option value="pending">等待中</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">网站</label>
                            <select class="form-select" id="siteFilter">
                                <option value="all">所有网站</option>
                                <option value="bqgns.com">笔趣阁</option>
                                <option value="22biqu.com">22笔趣</option>
                                <option value="biquge5200.cc">笔趣阁5200</option>
                                <option value="qu.la">顶点小说</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">&nbsp;</label>
                            <button class="btn btn-primary w-100" onclick="applyFilters()">
                                <i class="bi bi-funnel me-2"></i>应用筛选
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 统计概览卡片 -->
        <div class="card shadow mt-4 fade-in" style="animation-delay: 0.2s;">
            <div class="stat-card-header">
                <h5 class="mb-0"><i class="bi bi-graph-up me-2"></i>爬取统计概览</h5>
            </div>
            <div class="stat-card-body">
                <div class="row g-4">
                    <!-- 总爬取任务 -->
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="stat-value" id="totalTasks">0</div>
                            <div class="stat-label">总爬取任务</div>
                            <div class="text-muted small">
                                <i class="bi bi-clock-history me-1"></i>
                                <span id="timePeriod">最近7天</span>
                            </div>
                        </div>
                    </div>
                    <!-- 成功任务 -->
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="stat-value" id="successTasks">0</div>
                            <div class="stat-label">成功任务</div>
                            <div class="text-success small">
                                <i class="bi bi-check-circle-fill me-1"></i>
                                <span id="successRate">0%</span> 成功率
                            </div>
                        </div>
                    </div>
                    <!-- 失败任务 -->
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="stat-value" id="failedTasks">0</div>
                            <div class="stat-label">失败任务</div>
                            <div class="text-danger small">
                                <i class="bi bi-x-circle-fill me-1"></i>
                                <span id="failureRate">0%</span> 失败率
                            </div>
                        </div>
                    </div>
                    <!-- 总爬取章节 -->
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="stat-value" id="totalChapters">0</div>
                            <div class="stat-label">总爬取章节</div>
                            <div class="text-info small">
                                <i class="bi bi-book-fill me-1"></i>
                                平均 <span id="avgChaptersPerTask">0</span> 章/任务
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 爬取趋势图表卡片 -->
        <div class="card shadow mt-4 fade-in" style="animation-delay: 0.3s;">
            <div class="stat-card-header">
                <h5 class="mb-0"><i class="bi bi-trending-up me-2"></i>爬取趋势</h5>
            </div>
            <div class="stat-card-body">
                <div class="chart-container trend-chart">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 网站效率分析卡片 -->
        <div class="card shadow mt-4 fade-in" style="animation-delay: 0.4s;">
            <div class="stat-card-header">
                <h5 class="mb-0"><i class="bi bi-speedometer2 me-2"></i>网站爬取效率分析</h5>
            </div>
            <div class="stat-card-body">
                <div class="chart-container efficiency-chart">
                    <canvas id="efficiencyChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 导出按钮卡片 -->
        <div class="card shadow mt-4 fade-in" style="animation-delay: 0.5s;">
            <div class="card-body">
                <div class="d-flex justify-content-center gap-3">
                    <a href="index.html" class="btn btn-primary btn-lg">
                        <i class="bi bi-house-door-fill me-2"></i>返回首页
                    </a>
                    <a href="history.html" class="btn btn-secondary btn-lg">
                        <i class="bi bi-clock-history me-2"></i>查看历史
                    </a>
                    <button class="btn btn-success btn-lg" onclick="exportStats()">
                        <i class="bi bi-download me-2"></i>导出统计数据
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- API配置模态对话框 -->
    <div class="modal fade" id="apiConfigModal" tabindex="-1" aria-labelledby="apiConfigModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="apiConfigModalLabel">
                        <i class="bi bi-gear me-2"></i>API配置
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="apiConfigForm">
                        <div class="mb-3">
                            <label for="apiBaseUrl" class="form-label">API基础URL</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-link"></i></span>
                                <input type="url" class="form-control" id="apiBaseUrl" name="apiBaseUrl" placeholder="https://api.example.com" required>
                            </div>
                            <div class="form-text mt-2">
                                <i class="bi bi-info-circle text-primary me-1"></i>
                                配置文章爬取工具的API基础URL
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary" form="apiConfigForm">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
    <script>
        // 全局变量
        let trendChart = null;
        let efficiencyChart = null;

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化图表
            initCharts();
            
            // 显示加载状态
            showLoading();
            
            // 加载模拟数据
            loadMockData();
        });

        // 初始化图表
        function initCharts() {
            // 爬取趋势图
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '爬取任务数',
                            data: [],
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.3,
                            pointBackgroundColor: '#667eea',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointRadius: 6,
                            pointHoverRadius: 8
                        },
                        {
                            label: '爬取章节数',
                            data: [],
                            borderColor: '#764ba2',
                            backgroundColor: 'rgba(118, 75, 162, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.3,
                            pointBackgroundColor: '#764ba2',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointRadius: 6,
                            pointHoverRadius: 8
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: {
                                    size: 14
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleFont: {
                                size: 16
                            },
                            bodyFont: {
                                size: 14
                            },
                            padding: 15,
                            cornerRadius: 10
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: {
                                    size: 12
                                }
                            }
                        },
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            },
                            ticks: {
                                font: {
                                    size: 12
                                },
                                precision: 0
                            }
                        }
                    },
                    interaction: {
                        mode: 'index',
                        intersect: false
                    }
                }
            });

            // 网站效率图
            const efficiencyCtx = document.getElementById('efficiencyChart').getContext('2d');
            efficiencyChart = new Chart(efficiencyCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '平均爬取时间(秒)',
                            data: [],
                            backgroundColor: 'rgba(102, 126, 234, 0.8)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 2,
                            borderRadius: 8
                        },
                        {
                            label: '成功率(%)',
                            data: [],
                            backgroundColor: 'rgba(75, 192, 192, 0.8)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 2,
                            borderRadius: 8
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: {
                                    size: 14
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleFont: {
                                size: 16
                            },
                            bodyFont: {
                                size: 14
                            },
                            padding: 15,
                            cornerRadius: 10
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: {
                                    size: 12
                                }
                            }
                        },
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            },
                            ticks: {
                                font: {
                                    size: 12
                                }
                            }
                        }
                    }
                }
            });
        }

        // 显示加载状态
        function showLoading() {
            // 添加加载遮罩
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading-overlay';
            loadingDiv.innerHTML = `
                <div class="loading-content">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3 h5">正在加载统计数据...</p>
                </div>
            `;
            document.body.appendChild(loadingDiv);
            
            // 添加加载样式
            const style = document.createElement('style');
            style.innerHTML = `
                .loading-overlay {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background-color: rgba(255, 255, 255, 0.8);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 9999;
                    backdrop-filter: blur(5px);
                }
                
                .loading-content {
                    text-align: center;
                    background: white;
                    padding: 3rem;
                    border-radius: 1rem;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                }
            `;
            document.head.appendChild(style);
        }
        
        // 隐藏加载状态
        function hideLoading() {
            const loadingOverlay = document.querySelector('.loading-overlay');
            if (loadingOverlay) {
                loadingOverlay.remove();
            }
            
            const loadingStyle = document.head.querySelector('style:last-child');
            if (loadingStyle && loadingStyle.textContent.includes('.loading-overlay')) {
                loadingStyle.remove();
            }
        }
        
        // 加载模拟数据
        function loadMockData() {
            // 模拟API延迟
            setTimeout(() => {
                // 模拟统计数据
                const stats = {
                    totalTasks: 128,
                    successTasks: 112,
                    failedTasks: 16,
                    totalChapters: 3560,
                    avgChaptersPerTask: 27.8,
                    successRate: 87.5,
                    failureRate: 12.5
                };

                // 更新统计数据
                updateStats(stats);

                // 模拟趋势图数据
                const dates = ['1月11日', '1月12日', '1月13日', '1月14日', '1月15日', '1月16日', '1月17日'];
                const tasksData = [12, 18, 22, 15, 25, 18, 18];
                const chaptersData = [350, 520, 630, 420, 710, 530, 540];

                // 更新趋势图
                updateTrendChart(dates, tasksData, chaptersData);

                // 模拟效率图数据
                const sites = ['笔趣阁', '22笔趣', '笔趣阁5200', '顶点小说'];
                const avgTimeData = [12.5, 15.2, 10.8, 18.3];
                const successRateData = [92, 85, 95, 78];

                // 更新效率图
                updateEfficiencyChart(sites, avgTimeData, successRateData);
                
                // 隐藏加载状态
                hideLoading();
            }, 1000); // 模拟1秒延迟
        }

        // 更新统计数据
        function updateStats(stats) {
            document.getElementById('totalTasks').textContent = stats.totalTasks;
            document.getElementById('successTasks').textContent = stats.successTasks;
            document.getElementById('failedTasks').textContent = stats.failedTasks;
            document.getElementById('totalChapters').textContent = stats.totalChapters;
            document.getElementById('avgChaptersPerTask').textContent = stats.avgChaptersPerTask.toFixed(1);
            document.getElementById('successRate').textContent = stats.successRate.toFixed(1);
            document.getElementById('failureRate').textContent = stats.failureRate.toFixed(1);
        }

        // 更新趋势图
        function updateTrendChart(labels, tasksData, chaptersData) {
            trendChart.data.labels = labels;
            trendChart.data.datasets[0].data = tasksData;
            trendChart.data.datasets[1].data = chaptersData;
            trendChart.update();
        }

        // 更新效率图
        function updateEfficiencyChart(labels, avgTimeData, successRateData) {
            efficiencyChart.data.labels = labels;
            efficiencyChart.data.datasets[0].data = avgTimeData;
            efficiencyChart.data.datasets[1].data = successRateData;
            efficiencyChart.update();
        }

        // 应用筛选条件
        function applyFilters() {
            const timeRange = document.getElementById('timeRange').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const siteFilter = document.getElementById('siteFilter').value;
            const applyBtn = event.target;
            
            // 保存原始按钮文本
            const originalText = applyBtn.innerHTML;
            
            // 显示按钮加载状态
            applyBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>应用中...`;
            applyBtn.disabled = true;

            // 更新时间范围显示
            const timeRangeText = {
                '7': '最近7天',
                '30': '最近30天',
                '90': '最近90天',
                'all': '全部'
            };
            document.getElementById('timePeriod').textContent = timeRangeText[timeRange] || '最近7天';

            // 显示页面加载状态
            showLoading();
            
            // 模拟数据加载延迟
            setTimeout(() => {
                // 这里可以更新图表数据
                console.log('筛选条件应用成功:', { timeRange, statusFilter, siteFilter });
                
                // 恢复按钮原始状态
                applyBtn.innerHTML = originalText;
                applyBtn.disabled = false;
                
                // 隐藏加载状态
                hideLoading();
            }, 1000);
        }

        // 导出统计数据
        function exportStats() {
            // 这里可以添加导出功能
            alert('统计数据导出功能开发中');
        }

        // 全局关闭服务器键盘快捷键 (Ctrl+Shift+Q)
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey || e.altKey) && e.shiftKey && (e.key === 'q' || e.key === 'Q')) {
                e.preventDefault();
                if (confirm('真要关掉后端吗？\n关了这网页就废了。')) {
                    fetch('/api/shutdown', { method: 'POST' })
                        .then(() => {
                            document.body.innerHTML = `
                                <div class="container" style="max-width: 600px; margin-top: 15vh; font-family: sans-serif; padding: 2rem;">
                                    <div style="text-align: center; border: 4px solid #1a1a1a; background-color: #ffffff; padding: 3rem; box-shadow: 6px 6px 0 #1a1a1a;">
                                        <h2 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 1.5rem; color: #ff4d4d;">成功毁灭世界！</h2>
                                        <p style="margin: 1rem 0; font-size: 1.2rem; font-weight: bold; color: #1a1a1a;">后端服务已经被搞死了。</p>
                                        <p style="font-size: 1.2rem; font-weight: bold; color: #1a1a1a;">现在可以关闭浏览器了。</p>
                                    </div>
                                </div>
                            `;
                        })
                        .catch(() => {
                            document.body.innerHTML = `
                                <div class="container" style="max-width: 600px; margin-top: 15vh; font-family: sans-serif; padding: 2rem;">
                                    <div style="text-align: center; border: 4px solid #1a1a1a; background-color: #ffffff; padding: 3rem; box-shadow: 6px 6px 0 #1a1a1a;">
                                        <h2 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 1.5rem; color: #ff4d4d;">成功毁灭世界！</h2>
                                        <p style="margin: 1rem 0; font-size: 1.2rem; font-weight: bold; color: #1a1a1a;">后端服务已经被搞死了。</p>
                                        <p style="font-size: 1.2rem; font-weight: bold; color: #1a1a1a;">现在可以关闭浏览器了。</p>
                                    </div>
                                </div>
                            `;
                        });
                }
            }
        });
    </script>
</body>
</html>
