name = "article-crawler"
type = "pages"

[build]
# 静态前端不需要Python依赖，移除pip install命令
command = "echo 'Building static frontend...'"
publish = "frontend"

[functions]
# Cloudflare Pages Functions配置
# 支持JavaScript/TypeScript函数
# 函数文件位于functions/目录

[env.production]
[env.production.build]
command = "echo 'Building production static frontend...'"
publish = "frontend"

[env.development]
[env.development.build]
command = "echo 'Building development static frontend...'"
publish = "frontend"

# 配置CSP策略
[headers]
for = "/*"
[headers.values]
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' *; font-src 'self' https://cdn.jsdelivr.net; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests; block-all-mixed-content;"
X-Frame-Options = "SAMEORIGIN"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
